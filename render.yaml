# Proposed unified hosting; applying this blueprint requires human approval.
# CB-11 worker provisioning remains gated on hosted CB-10 acceptance and D9 approval.
# Review the existing dashboard-managed sioona-api before adopting it into this blueprint.
services:
  - type: web
    name: sioona-site
    runtime: node
    rootDir: site
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PILOT_INTAKE_BACKEND_URL
        sync: false
      - key: SIOONA_SERVICE_TOKEN
        sync: false
      - key: PILOT_CONTACT_SUPPORT_EMAIL
        sync: false
      - key: PILOT_CONTACT_RETENTION
        sync: false
      - key: PILOT_CONTACT_HOSTING_REGION
        sync: false

  - type: web
    name: sioona-web
    runtime: node
    rootDir: web
    buildCommand: |
      npm ci
      npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
      npm install --no-save "@next/swc-linux-x64-gnu@$(node -p "require('next/package.json').version")"
      npm run build
    startCommand: npm start
    healthCheckPath: /
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: SIOONA_ENV
        value: "production"
      - key: BACKEND_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SIOONA_SERVICE_TOKEN
        sync: false
      - key: SIOONA_TENANT_ID
        sync: false
      - key: SIOONA_PILOT_USERS
        sync: false
      - key: SIOONA_IDENTITY_KEY
        sync: false
      - key: SIOONA_ACTOR_KEY
        sync: false

  - type: web
    name: sioona-api
    runtime: python
    rootDir: backend
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.check_schema && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 110
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SIOONA_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: SIOONA_SERVICE_TOKEN
        sync: false
      - key: SIOONA_ACTOR_KEY
        sync: false

  - type: cron
    name: sioona-ingestion-recovery
    autoDeployTrigger: "off"
    runtime: python
    rootDir: backend
    # UTC. Uploads staged longer than --grace-seconds are retried in bounded batches;
    # a non-zero exit marks the run failed when any recovery fails.
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.check_schema && exec python -m app.recover_ingestions --limit 20 --grace-seconds 300
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      # Cross-tenant recovery needs the separately approved recovery/admin role.
      - key: MIGRATION_DATABASE_URL
        sync: false

  - type: worker
    name: sioona-detection-worker
    runtime: python
    rootDir: backend
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.check_schema && exec python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SIOONA_DETECTION_EXECUTION
        value: worker
      - key: SIOONA_WORKER_PAUSE
        value: "1"
      - key: SIOONA_WORKER_TENANTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SIOONA_ACTOR_KEY
        sync: false
      - key: DETECT_LLM
        value: "0"
      - key: GROQ_API_KEY
        sync: false
