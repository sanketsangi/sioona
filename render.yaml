# Deployment proposal only: CB-11 worker remains unprovisioned until hosted CB-10 acceptance.
# Defines the ingestion recovery cron and proposed durable worker. The existing sioona-api web service
# is managed in the Render dashboard and is intentionally not declared here.
services:
  - type: cron
    name: sioona-ingestion-recovery
    runtime: python
    rootDir: backend
    # UTC. Uploads staged longer than --grace-seconds are retried in bounded batches;
    # a non-zero exit marks the run failed when any recovery fails.
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.recover_ingestions --limit 20 --grace-seconds 300
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: sioona-detection-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SIOONA_DETECTION_EXECUTION
        value: worker
      - key: SIOONA_WORKER_PAUSE
        value: "1"
      - key: SIOONA_WORKER_TENANTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DETECT_LLM
        value: "0"
      - key: GROQ_API_KEY
        sync: false
