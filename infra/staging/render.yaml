# Proposal only. Never apply before cost/target approval and exact-revision CI.
# Empty isolated DB; never clone production or attach a production env group.
databases:
  - name: sioona-staging-db
    databaseName: sioona_staging
    plan: 0.1c-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
    region: virginia
    postgresMajorVersion: "17"
services:
  - type: web
    name: sioona-api-staging
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    repo: https://github.com/sanketsangi/sioona
    rootDir: backend
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SIOONA_ENV
        value: production
      - key: SIOONA_ACTOR_AUTH
        value: shadow
      - key: DATABASE_URL
        fromDatabase:
          name: sioona-staging-db
          property: connectionString
      # Human step after 024_tenant_rls: point DATABASE_URL at NOLOGIN-turned
      # sioona_runtime and set this to the owner connection. Alembic uses it
      # when present. Do not apply this file before cost approval.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SIOONA_SERVICE_TOKEN
        sync: false
      - key: SIOONA_ACTOR_KEY
        sync: false
# Intentionally no migration/seed command, worker, cron, or outbound integration.
