# Operator-reviewed proposal; apply only after exact-target approval and CI.
# Existing free API srv-db62psijnfac73c74oj0; Web requires separate approval.
# Neon sioona_staging_clean is bootstrapped exclusively by the human operator.
services:
  - type: web
    name: sioona-web-staging
    runtime: node
    plan: free
    region: virginia
    rootDir: web
    buildCommand: |
      npm ci
      npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
      npm install --no-save "@next/swc-linux-x64-gnu@$(node -p "require('next/package.json').version")"
      npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: SIOONA_ENV
        value: "production"
      - key: SIOONA_ACTOR_AUTH
        value: "shadow"
      - key: BACKEND_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SIOONA_SERVICE_TOKEN
        sync: false
      - key: SIOONA_TENANT_ID
        sync: false
      - key: SIOONA_PILOT_USERS
        sync: false
      - key: SIOONA_IDENTITY_KEY
        sync: false
      - key: SIOONA_ACTOR_KEY
        sync: false
      - key: DETECT_LLM
        value: "0"
      - key: LIVE_INGEST
        value: "0"
      - key: SIOONA_EXTERNAL_ACTIONS_ENABLED
        value: "0"
      - key: SIOONA_PUBLIC_DEMO
        value: "0"
      - key: SIOONA_ALLOW_DEMO_ACTIONS
        value: "1"

  - type: web
    name: sioona-api-staging
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.check_schema && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 110
    healthCheckPath: /health
    envVars:
      - key: DETECT_LLM
        value: "0"
      - key: LIVE_INGEST
        value: "0"
      - key: SIOONA_EXTERNAL_ACTIONS_ENABLED
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SIOONA_ENV
        value: "production"
      - key: SIOONA_ACTOR_AUTH
        value: "shadow"
      - key: DATABASE_URL
        sync: false
      # Direct Neon runtime URL after Step 2; owner URL stays in human terminal.
      # Optional migration override is not required by the running service.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SIOONA_SERVICE_TOKEN
        sync: false
      - key: SIOONA_ACTOR_KEY
        sync: false

# Intentionally no migration/seed command, worker, cron, site, or outbound integration.
