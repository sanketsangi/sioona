# Pre-deploy gate: the same commands as web/DEPLOY.md.
# Held-out eval packs (groww-batch02, partner-export week4) skip when absent.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          npm ci
          # npm/cli#4828: lockfile from macOS omits the Linux Rollup optional binary.
          npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  site:
    name: Marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sioona
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: sioona_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sioona -d sioona_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest
      - name: PostgreSQL migration and constraint checks
        env:
          PG_TEST_DATABASE_URL: postgresql+psycopg://sioona:ci_only@localhost:5432/sioona_migration_test
        run: python -m pytest tests/test_postgres_migrations.py -q
