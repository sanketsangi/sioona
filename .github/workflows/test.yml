# Pre-deploy gate: the same commands as web/DEPLOY.md.
# Held-out eval packs (groww-batch02, partner-export week4) skip when absent.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          npm ci
          # npm/cli#4828: lockfile from macOS omits the Linux Rollup optional binary.
          npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  site:
    name: Marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-secret QA fixtures: exercise strict production validation in CI.
    # These are not deployment configuration or approved public launch facts.
    env:
      NEXT_PUBLIC_SITE_URL: https://launch.example.test
      NEXT_PUBLIC_APP_URL: ""
      PILOT_CONTACT_SUPPORT_EMAIL: launch@example.test
      PILOT_CONTACT_RETENTION: Synthetic verification policy only
      PILOT_CONTACT_HOSTING_REGION: synthetic-test-region
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test SEO operator helpers
        run: |
          npm ci --prefix ../tools/seo
          npm test --prefix ../tools/seo
      - name: Audit rendered SEO contracts
        run: |
          node --test ../ops/seo/audit-site.test.mjs
          node ../ops/seo/audit-site.mjs

  backend:
    name: Backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sioona
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: sioona_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sioona -d sioona_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Check dependencies
        run: pip check
      - name: Test
        run: python -m pytest
      - name: Install PostgreSQL 17 restore tools
        run: |
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          distro_codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          architecture="$(dpkg --print-architecture)"
          printf 'deb [arch=%s signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' \
            "$architecture" "$distro_codename" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: PostgreSQL migration and constraint checks
        env:
          CB19_PG_BIN: /usr/lib/postgresql/17/bin
          PG_TEST_DATABASE_URL: postgresql+psycopg://sioona:ci_only@localhost:5432/sioona_migration_test
        run: python -m pytest tests/test_postgres_migrations.py tests/test_operator_staging_op4_drill.py tests/test_operator_production_upgrade.py -q

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sioona
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: sioona_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sioona -d sioona_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrate CI Postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sioona:ci_only@127.0.0.1:5432/sioona_migration_test
        run: alembic upgrade head
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web
        working-directory: web
        run: |
          npm ci
          # npm/cli#4828: a macOS lockfile omits some Linux optional binaries.
          # Next otherwise downloads the missing SWC package from registry.npmjs.org.
          npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"
          npm install --no-save "@next/swc-linux-x64-gnu@$(node -p "require('next/package.json').version")"
          npx playwright install --with-deps chromium
      - name: Outbound guard regression tests
        working-directory: web
        env:
          CB02_TEST_OS_GUARD: "1"
        run: node --test e2e/ci-gate.test.mjs e2e/outbound-gate.test.mjs e2e/publish-gate.test.mjs
      - name: Upload, review, persisted decision
        working-directory: web
        env:
          DATABASE_URL: postgresql+psycopg://sioona:ci_only@127.0.0.1:5432/sioona_migration_test
          DETECT_LLM: "0"
          SIOONA_STATE_MODE: "postgres"
          SIOONA_TAXONOMY_NEON: "1"
          CB10_E2E_DATA_PATH_FILE: /tmp/cb10-e2e-data-path
          CI: "true"
        run: |
          bash e2e/guard-linux.sh npm run e2e
          cp "$CB10_E2E_DATA_PATH_FILE" /tmp/cb10-e2e-previous-server.json
          CB10_E2E_PREVIOUS_SERVER=/tmp/cb10-e2e-previous-server.json bash e2e/guard-linux.sh npm run e2e -- --grep "reconstruct persisted"

  eval-gate:
    name: Eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Offline promotion gate
        run: npm run eval:gate
      - name: Retain promotion artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb-09-eval-gate
          path: web/eval/gate/artifact.json
          if-no-files-found: error

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0
        run: |
          version=8.28.0
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  ${archive}" | sha256sum -c
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Scanner exemption regression tests
        run: node --test web/e2e/scan-gate.test.mjs
      - name: Scanner flags the canary fixture
        run: |
          work="$(mktemp -d)"
          cp .github/secret-scan-fixture/canary.txt "$work/canary.txt"
          set +e
          gitleaks detect --no-git --source "$work" --no-banner --redact
          code=$?
          set -e
          test "$code" -eq 1
      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
