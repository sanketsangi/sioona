name: Keep site alive

on:
  schedule:
    # UTC minute boundaries; best effort because Actions schedules can be delayed.
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site liveness
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-max-time 240 \
            --output /tmp/site-health.json \
            https://sioona.si/health
          jq -e '.status == "ok"' /tmp/site-health.json
