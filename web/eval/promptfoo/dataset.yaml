# Finance support chats for Sioona signal-detection eval.
# Extend by appending tests with customerName, channel, customerMessages, expectedSignal.
# expectedSignal uses corpus labels from Detect v2: retention_risk | upsell_opportunity | lead_intent | none

- description: Lead — new demat account and brokerage pricing
  vars:
    customerName: Asha Mehta
    channel: whatsapp
    customerMessages: |
      Hi, I want to open a demat account this week. What are your brokerage charges?
      New investor. Looking to start investing in equity and want to start a SIP.
    expectedSignal: lead_intent
  metadata:
    turns:
      - { role: customer, content: "Hi, I want to open a demat account this week. What are your brokerage charges?" }
      - { role: agent, content: "Happy to help! Are you a new investor or transferring holdings?" }
      - { role: customer, content: "New investor. Looking to start investing in equity and want to start a SIP." }

- description: Retention — fee dispute then close account threat
  vars:
    customerName: Rohan Kapoor
    channel: whatsapp
    customerMessages: |
      I've asked three times about this unexplained fee. This is unacceptable.
      If this isn't fixed today I'm closing my account and moving my money elsewhere.
      Your competitor is cheaper and actually replies.
    expectedSignal: retention_risk
  metadata:
    turns:
      - { role: customer, content: "I've asked three times about this unexplained fee. This is unacceptable." }
      - { role: agent, content: "Sorry for the trouble — let me check your ledger." }
      - { role: customer, content: "If this isn't fixed today I'm closing my account and moving my money elsewhere." }
      - { role: customer, content: "Your competitor is cheaper and actually replies." }

