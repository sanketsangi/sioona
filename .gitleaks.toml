title = "Sioona"

[extend]
useDefault = true

[[allowlists]]
description = "Only the synthetic canary at its exact fixture path."
condition = "AND"
paths = ['''(^|/)\.github/secret-scan-fixture/canary\.txt$''']
regexTarget = "secret"
regexes = ['''^AKIA234567BCDEFGHIJK$''']

[[allowlists]]
description = "Only the synthetic budget actor key at its exact regression-test path (including committed history)."
condition = "AND"
paths = ['''(^|/)web/src/lib/backend-client\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^synthetic-actor-key-at-least-32-bytes$''']

[[allowlists]]
description = "Only synthetic pilot test idempotency keys at their exact test path."
condition = "AND"
paths = ['''(^|/)backend/tests/test_pilot_requests\.py$''']
regexTarget = "secret"
regexes = ['''^global-pilot-test-000[123]$''']
